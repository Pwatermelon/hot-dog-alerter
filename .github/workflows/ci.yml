name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0
      - name: Install Python deps
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt
      - name: Import smoke test
        run: |
          python - <<'PY'
          import os
          from src.detection.yolo_detector import HotDogDetector
          from src.config import MODEL_PATH, APP_VERSION
          assert os.path.exists(MODEL_PATH), MODEL_PATH
          det = HotDogDetector(MODEL_PATH)
          import numpy as np
          img = np.zeros((480, 640, 3), dtype=np.uint8)
          _, boxes = det.detect_on_image(img, draw=False)
          print("version", APP_VERSION, "boxes", len(boxes))
          print("smoke ok")
          PY
