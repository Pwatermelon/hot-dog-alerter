name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      create_release:
        description: "Upload artifacts to a GitHub Release"
        type: boolean
        default: true

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.11"

jobs:
  build-desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: HotDogAlerter-windows-x64.exe
            binary: dist/HotDogAlerter.exe
          # macos-13 снят (Dec 2025). Intel → macos-15-intel, Apple Silicon → macos-14/15
          - os: macos-15-intel
            artifact: HotDogAlerter-macos-x64
            binary: dist/HotDogAlerter
          - os: macos-14
            artifact: HotDogAlerter-macos-arm64
            binary: dist/HotDogAlerter
          - os: ubuntu-22.04
            artifact: HotDogAlerter-linux-x64
            binary: dist/HotDogAlerter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Linux GUI deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 \
            libglib2.0-0 \
            libxkbcommon0 \
            libdbus-1-3 \
            libxcb-xinerama0 \
            libxcb-cursor0 \
            libpulse0 \
            upx-ucl

      - name: Install UPX (macOS)
        if: runner.os == 'macOS'
        run: brew install upx || true

      - name: Ensure ONNX model
        shell: bash
        run: |
          if [ ! -f models/yolov8n.onnx ]; then
            python -m pip install -U pip
            python -m pip install ultralytics onnx
            python scripts/export_onnx.py
          fi
          ls -lh models/

      - name: Install app dependencies
        run: |
          python -m pip install -U pip wheel
          python -m pip install -r requirements.txt pyinstaller

      - name: Build binary
        run: python scripts/build_desktop.py

      - name: Package artifact
        shell: bash
        run: |
          mkdir -p out
          cp "${{ matrix.binary }}" "out/${{ matrix.artifact }}"
          if [ "${{ runner.os }}" != "Windows" ]; then
            chmod +x "out/${{ matrix.artifact }}"
          fi
          ls -lh out/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/${{ matrix.artifact }}
          if-no-files-found: error

  build-android:
    name: Android APK
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Android project
        run: |
          mkdir -p android/models android/sounds
          if [ ! -f models/yolov8n.onnx ]; then
            python3 -m pip install -U pip ultralytics onnx
            python3 scripts/export_onnx.py
          fi
          cp models/yolov8n.onnx android/models/
          cp sounds/hotdog_alert.mp3 android/sounds/ || true
          cp assets/icons/app.png android/icon.png || true

      - name: Build APK with Buildozer (Docker)
        run: |
          # ENTRYPOINT образа = buildozer. В CI не спрашиваем про root.
          mkdir -p "$HOME/.buildozer"
          # Права: контейнерный user (uid 1000) должен писать в android/
          sudo chown -R 1000:1000 android "$HOME/.buildozer" || chown -R 1000:1000 android "$HOME/.buildozer" || true
          docker run --rm \
            --user 1000:1000 \
            -e HOME=/home/user \
            -v "$PWD/android":/home/user/hostcwd \
            -v "$HOME/.buildozer":/home/user/.buildozer \
            -w /home/user/hostcwd \
            --entrypoint buildozer \
            kivy/buildozer:latest \
            -v android debug

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p out
          APK=$(find android -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "APK not found"
            find android -maxdepth 4 -type f | head -n 200
            exit 1
          fi
          cp "$APK" out/HotDogAlerter-android.apk
          ls -lh out/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HotDogAlerter-android.apk
          path: out/HotDogAlerter-android.apk
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [build-desktop, build-android]
    runs-on: ubuntu-latest
    if: always() && needs.build-desktop.result == 'success' && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -lh release/
          test -n "$(ls -A release)"

      - name: Resolve tag name
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v1.1.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Hot-Dog Alerter ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          files: release/*
          body: |
            ## Downloads
            - **Windows**: `HotDogAlerter-windows-x64.exe`
            - **macOS Intel**: `HotDogAlerter-macos-x64`
            - **macOS Apple Silicon**: `HotDogAlerter-macos-arm64`
            - **Linux**: `HotDogAlerter-linux-x64`
            - **Android**: `HotDogAlerter-android.apk`

            Desktop builds use YOLOv8n ONNX + OpenCV DNN (no PyTorch) for smaller binaries.
            Android build uses the camera for live hot-dog detection.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
